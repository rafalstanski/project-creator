[project]
name = "project-creator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
project-creator = "project_creator.create:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PL", "RUF", "FA", "FLY", "ARG", "SIM"]
